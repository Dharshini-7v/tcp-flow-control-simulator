# ─────────────────────────────────────────────────────────────────────────────
# GitHub Pages Deployment — TCP Flow-Control Simulator
#
# Deploys the contents of /docs to GitHub Pages on every push to main.
# The /docs folder contains the static frontend demo (no backend required).
#
# After enabling Pages in repo Settings → Pages → Source: Deploy from branch
# → Branch: main → Folder: /docs, your site will be live at:
#   https://<username>.github.io/<repo-name>/
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"            # only re-deploy when docs/ changes
      - ".github/workflows/pages.yml"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify docs/ contents
        run: |
          echo "Files in docs/:"
          ls -la docs/
          # Fail fast if critical files are missing
          for FILE in index.html simulator.html tcp.js renderer.js main.js theme.js style.css; do
            [ -f "docs/$FILE" ] \
              && echo "  [OK] $FILE" \
              || { echo "  [MISSING] $FILE"; exit 1; }
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
