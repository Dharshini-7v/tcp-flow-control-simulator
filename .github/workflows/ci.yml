# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI — TCP Flow-Control Simulator
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Install, lint, smoke-test ───────────────────────────────────────
  lint-and-test:
    name: Lint & Smoke Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: ["18", "20"]

    defaults:
      run:
        working-directory: backend   # all run steps execute inside backend/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # cache path relative to repo root
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Syntax check — server.js
        run: node --check server.js

      - name: Syntax check — middleware/auth.js
        run: node --check middleware/auth.js

      - name: Syntax check — routes/auth.js
        run: node --check routes/auth.js

      - name: Ensure data directory exists
        run: |
          mkdir -p data
          echo "[]" > data/users.json

      - name: Start server in background
        run: node server.js &
        env:
          PORT: 3001
          JWT_SECRET: ci_test_secret_key_github_actions

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/ && echo "Server ready" && break
            echo "Waiting... attempt $i"
            sleep 1
          done

      - name: Smoke — register a new user
        run: |
          RESP=$(curl -sf -X POST http://localhost:3001/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI User","email":"ci@test.com","password":"testpass123"}')
          echo "$RESP" | grep -q '"token"' \
            && echo "REGISTER OK" \
            || { echo "REGISTER FAILED: $RESP"; exit 1; }

      - name: Smoke — login with correct credentials
        run: |
          RESP=$(curl -sf -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"testpass123"}')
          echo "$RESP" | grep -q '"token"' \
            && echo "LOGIN OK" \
            || { echo "LOGIN FAILED: $RESP"; exit 1; }

      - name: Smoke — wrong password returns 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"wrongpass"}')
          [ "$STATUS" = "401" ] \
            && echo "WRONG PASSWORD rejected correctly" \
            || { echo "Expected 401, got $STATUS"; exit 1; }

      - name: Smoke — /me without token returns 401
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:3001/api/auth/me)
          [ "$STATUS" = "401" ] \
            && echo "NO TOKEN rejected correctly" \
            || { echo "Expected 401, got $STATUS"; exit 1; }

      - name: Smoke — all frontend files are served
        run: |
          for FILE in login.html register.html simulator.html \
                      auth.js auth.css style.css \
                      tcp.js renderer.js main.js theme.js; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:3001/$FILE)
            [ "$STATUS" = "200" ] \
              && echo "  [200] $FILE" \
              || { echo "  [MISSING] $FILE ($STATUS)"; exit 1; }
          done

  # ── Job 2: Build Docker image ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tcp-simulator:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
