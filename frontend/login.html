<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TCP Simulator</title>
  <link rel="stylesheet" href="auth.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">⧉</div>
      <h1>TCP Simulator</h1>
      <p>Flow-Control &amp; Sliding Window</p>
    </div>

    <h2>Sign In</h2>

    <div id="alertBox" class="alert hidden"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <span class="field-error" id="emailError"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">👁</button>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Sign In</span>
        <span id="btnSpinner" class="spinner hidden"></span>
      </button>
    </form>

    <p class="auth-link">
      Don't have an account? <a href="register.html">Create one</a>
    </p>

    <!-- Theme picker -->
    <div id="themePickerMount"></div>
  </div>

  <script src="auth.js"></script>
  <script>
    ThemeEngine.buildThemePicker('#themePickerMount', 'dropdown');
    // ── Login page logic ────────────────────────────────────────────────────
    // If already logged in, go straight to simulator
    if (localStorage.getItem('tcp_token')) {
      window.location.href = 'simulator.html';
    }

    const form       = document.getElementById('loginForm');
    const alertBox   = document.getElementById('alertBox');
    const btnText    = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const submitBtn  = document.getElementById('submitBtn');
    const togglePw   = document.getElementById('togglePw');
    const pwInput    = document.getElementById('password');

    // Toggle password visibility
    togglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      togglePw.textContent = show ? '🙈' : '👁';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const email    = document.getElementById('email').value.trim();
      const password = pwInput.value;

      // Client-side validation
      let valid = true;
      if (!email) { showFieldError('emailError', 'Email is required.'); valid = false; }
      if (!password) { showFieldError('passwordError', 'Password is required.'); valid = false; }
      if (!valid) return;

      setLoading(true);

      try {
        const res  = await AuthAPI.login(email, password);
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Login failed.', 'error');
          return;
        }

        // Store token and user info
        localStorage.setItem('tcp_token', data.token);
        localStorage.setItem('tcp_user',  JSON.stringify(data.user));

        showAlert('Login successful! Redirecting…', 'success');
        setTimeout(() => { window.location.href = 'simulator.html'; }, 700);

      } catch (err) {
        showAlert('Cannot reach server. Make sure the backend is running.', 'error');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(on) {
      submitBtn.disabled = on;
      btnText.textContent = on ? 'Signing in…' : 'Sign In';
      btnSpinner.classList.toggle('hidden', !on);
    }

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className   = `alert alert-${type}`;
    }

    function showFieldError(id, msg) {
      document.getElementById(id).textContent = msg;
    }

    function clearErrors() {
      document.getElementById('emailError').textContent    = '';
      document.getElementById('passwordError').textContent = '';
      alertBox.className = 'alert hidden';
    }
  </script>
</body>
</html>
